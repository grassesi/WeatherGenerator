healpix_level: 3 # TODO check for smoothing artifacts in sst texture

# TODO change model complexity?!
# fe_num_blocks: 16
# ae_local_dim_embed: 2048
# ae_global_dim_embed: 2048

training_config:
  time_window_step: '24:00:00'
  time_window_len: '24:00:00'

  # 2 steps @ 24h => 2 day rollout. num_steps is spelled out because this block would
  # otherwise override the 2 set in master_ocean.yml.
  forecast: {time_step: '24:00:00', num_steps: 2}

# TODO adjust validation_config.forecast.num_steps / training_config.forecast.num_step for finetuning (maybe 2/4)?

test_config:
  forecast: {num_steps: 124} # 124 x 24h = 124 days, the horizon 31 x 96h used to give

streams:
  # sst (and ci) are daily fields in the s2s store: 100% of points change at 00Z and
  # ~none at 06/12/18Z, so 24h sampling is lossless and lands on the update time.
  # One sample per 24h window => averaging would be a no-op.
  ERA5-Ocean: {frequency: '24:00:00', average_window: False}
  # ERA5 and radiation stay at 6h: 4 samples per window, averaged to a daily value.
  # Radiation must not be subset to 24h -- ssrd/strd/ttr genuinely change every 6h, so
  # that would keep only the 00-06Z accumulation and drop 3/4 of the daily energy.
  ERA5: {frequency: '06:00:00', average_window: True}
  ERA5-radiation: {frequency: '06:00:00', average_window: True}