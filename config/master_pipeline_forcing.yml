# Generation 02a relaunch, 2026-08-16. Two changes against the -02 launch:
#
#  * The ocean stages now start from the ablation checkpoints gahsjdr2 / uvjvioea instead of
#    the diagnostic e0jyb327 / u21dnncg. The ablation models source SST as well as the
#    atmosphere and score ~2.2x better (1.2232e-03 / 1.2014e-03 against 2.731e-03 /
#    2.115e-03). The SST source carries over from the parent checkpoint, so no stream
#    override is needed here.
#  * The atmo stages go to chain_jobs: 4 (the launcher maximum). At 5h20m per mini-epoch the
#    16 mini-epochs need ~85h against the 96h four parts provide -- tight but sufficient.
#
# The -02 attempt is superseded: rlulwecu diverged at the LR warmup peak on the oversized
# ForcingEngine init (fixed in forcing.py, 2026-08-16) and ya6l39vl ran out of chain.
parallelize: True
stages:
# finetuning ocean
 - name: atmosurface+sst-sst_forcing-ft
   stage: train
   from_run_id: gahsjdr2
   config_files:
    - config/master_ocean_finetuning.yml
    - config/ocean_finetuning_overwrite.yml
   options:
    - ffe_num_blocks=2
    - streams.ERA5.is_dynamic_forcing=True
    - wgtags.grid=master-coupling-forcing-ft-02a
    - wgtags.exp=atmosurface+sst-sst

 - name: rad+atmosurface+sst-sst-forcing-ft
   stage: train
   from_run_id: uvjvioea
   config_files:
    - config/master_ocean_finetuning.yml
    - config/ocean_finetuning_overwrite.yml
   options:
    - ffe_num_blocks=2
    - streams.ERA5.is_dynamic_forcing=True
    - streams.ERA5-radiation.is_dynamic_forcing=True
    - wgtags.grid=master-coupling-forcing-ft-02a
    - wgtags.exp=rad+atmosurface+sst-sst
# finetuning atmo
 - name: sst+atmo-atmo_forcing-ft
   stage: train
   chain_jobs: 4
   from_run_id: g2xxepr3
   config_files:
    - config/master_ocean_finetuning.yml
   options:
   # is ERA5 also needed? inject insolation geoinfo -> goes to decoder -> frozen :|
    - ffe_num_blocks=2
    - streams.ERA5-Ocean.is_dynamic_forcing=True
    - wgtags.grid=master-coupling-forcing-ft-02a
    - wgtags.exp=sst+atmo-atmo_ft

 - name: sst+atmo-atmo+rad_forcing-ft
   stage: train
   chain_jobs: 4
   from_run_id: qws8i6pi
   config_files:
    - config/master_ocean_finetuning.yml
   options:
    - ffe_num_blocks=2
    - streams.ERA5-Ocean.is_dynamic_forcing=True
    - wgtags.grid=master-coupling-forcing-ft-02a
    - wgtags.exp=sst+atmo-atmo+rad_ft
