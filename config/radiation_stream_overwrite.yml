streams:
  ERA5-radiation :
    type : anemoi
    filenames : ['radiaiton_era5_1.25_1979-2022-6h-v1_hydrology.zarr']
    stream_id : 0
    # insolation excluded since computed forcing
    source : ['avg_sdlwrf', 'avg_sdswrf']
    target : []
    is_dynamic_forcing: True
    loss_weight : 1.
    location_weight : cosine_latitude
    masking_rate : 0.6
    masking_rate_none : 0.05
    token_size : 8
    tokenize_spacetime : True
    max_num_targets: -1 
    embed : 
        net : transformer
        num_tokens : 1
        num_heads : 8
        dim_embed : 256
        num_blocks : 2
    embed_target_coords :
        net : linear
        dim_embed : 256
    target_readout :
        num_layers : 2
        num_heads : 4
        # sampling_rate : 0.2
    pred_head :
        ens_size : 1
        num_layers : 1