# Generation 02a relaunch, 2026-08-16: the two coupled arms restart from the ablation
# checkpoints gahsjdr2 / uvjvioea instead of the diagnostic e0jyb327 / u21dnncg. Those
# ablation models source SST as well as the atmosphere and score ~2.2x better
# (1.2232e-03 / 1.2014e-03 against 2.731e-03 / 2.115e-03), so the stage names gain the
# `sst+` that the model composition now carries. The SST source comes from the parent
# checkpoint; no stream override is needed here.
#
# sst-sst is deliberately not relaunched: hzk8rp46 is not a diagnostic arm and has no
# ablation counterpart, so re-running it would only duplicate twrig7it.
parallelize: True
stages:
# - name: sst-sst
#   stage: train
#   from_run_id: hzk8rp46
#   config_files:
#    - config/master_ocean_finetuning.yml
#    - config/ocean_finetuning_overwrite.yml
#   options:
#    - wgtags.exp=sst-sst_ft
#    - wgtags.grid=master-coupling-forcing-ft-02

 - name: sst+atmosurface-sst_ft
   stage: train
   from_run_id: gahsjdr2
   config_files:
    - config/master_ocean_finetuning.yml
    - config/ocean_finetuning_overwrite.yml
   options:
    - wgtags.exp=sst+atmosurface-sst_ft
    - wgtags.grid=master-coupling-forcing-ft-02a

 - name: rad+sst+atmosurface-sst_ft
   stage: train
   from_run_id: uvjvioea
   config_files:
    - config/master_ocean_finetuning.yml
    - config/ocean_finetuning_overwrite.yml
   options:
    - wgtags.exp=rad+sst+atmosurface-sst_ft
    - wgtags.grid=master-coupling-forcing-ft-02a
  
# reduce n_forecast steps (other models train for eg. 1 step @ 96h), cannot train for 16 steps @ 96h (beyond forecast horizon) => 2 steps @ 24 + 8 steps @ 24