Atmo-Ocean:
  type: coupling
  streams:
    producer: Ocean # => has ERA5-Ocean as target
    consumer: Atmo # => has ERA5-Ocean as source
    stream: ERA5-Ocean

ERA5-Ocean

- producer: Ocean
  consumer: Atmo
  stream: ERA5-Ocean
- producer: Ocean 
  consumer: Atmo
  stream: ERA5-Ocean


ERA5-Ocean :
  type : anemoi
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v2-s2s-predictors.zarr']
  stream_id : 0 # has to do with tokenization??
  source : []
  target : ["sst"]
  is_dynamic_forcing: True
  loss_weight : 1.
  location_weight : cosine_latitude
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: -1 
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    num_layers : 2
    num_heads : 4
    # sampling_rate : 0.2
  pred_head :
    ens_size : 1
    num_layers : 1
# maybe channel weights