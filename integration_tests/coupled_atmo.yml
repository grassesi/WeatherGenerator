# The fast half of the coupled pair: a 6 h window stepping 6 h, as the atmosphere runs.
#
# ffe_num_blocks is what makes the forcing engine real: ForcedModel reads
# cf.get("ffe_num_blocks", 0) and with zero blocks ForcingEngine.forward returns its input
# unchanged, so a component would look forcing-capable and silently not be.
ffe_num_blocks: 2
streams_directory: "./integration_tests/streams_coupled_atmo/"
