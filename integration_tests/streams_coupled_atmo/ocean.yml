# The partner's stream as the atmosphere was trained on it: 6-hourly. The ocean predicts it only every 24 h, so the coupling must upsample.
OCEAN :
  type : anemoi
  stream_id: 1
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2023-6h-v8.zarr']
  loss_weight : 1.
  source : ["z_850"]
  target : []
  diagnostic : False
  masking_rate : 0.0
  frequency : 06:00:00
  average_window : False
  is_dynamic_forcing : true
  # How far before the window it forces this stream is sampled. A property of the *model*, so
  # it lives on the stream and rides in the checkpoint: the dynamic-forcing response is trained
  # at one lag and the same lag must hold through finetuning and inference. The couplings file
  # must not set it. Absent, or the alias 'step', means forecast.offset * time_window_step,
  # which is what the code did before the key existed.
  #
  # DLESyM (Cresswell-Clay et al. 2025): the atmosphere is forced by a *stale* ocean, which is
  # the asymmetry the scheme turns on. 6 h is both the default and the smallest legal value
  # (`len_c - P + chunk_length` = 6 h - 24 h + 24 h), the ocean being stepped after the
  # atmosphere. Stated explicitly rather than left to the default so the scheme is legible in
  # the checkpoint. See `forcing_lag_design.md` B and D4.
  forcing_lag : '06:00:00'
  masking_rate_none : 0.05
  token_size : 32
  tokenize_spacetime : True
  max_num_targets: -1
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 2
    dim_embed : 16
    num_blocks : 2
  embed_target_coords :
    net : linear
    dim_embed : 16
  target_readout :
    num_layers : 2
    num_heads : 2
  pred_head :
    ens_size : 1
    num_layers : 1
